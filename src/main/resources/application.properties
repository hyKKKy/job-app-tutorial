spring.application.name=job-app-tutorial

# Connection settings
spring.datasource.url=jdbc:mysql://localhost:3307/jobs_app_database
spring.datasource.username=root
spring.datasource.password=root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialect and SQL logging
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Schema is created manually (see sql/schema.sql), Hibernate must not change it
spring.jpa.hibernate.ddl-auto=none
